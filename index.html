<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>B3A · 深圳灣口岸 ⇄ 富泰 實時到站</title>
<style>
  :root{
    --bg:#f5f5f1;
    --card:#ffffff;
    --ink:#111318;
    --ink-2:#4d545e;
    --ink-3:#8a9099;
    --line:#e8e8e2;
    --line-soft:#f2f2ec;
    --yellow:#ffc72c;
    --yellow-deep:#7a5f00;
    --yellow-soft:#fff6d8;
    --yellow-line:#ffe9a8;
    --green:#0d7a3d;
    --green-soft:#eaf7ef;
    --red:#c0392b;
    --red-soft:#fdf0ed;
    --shadow:0 1px 2px rgba(17,19,24,.05), 0 12px 30px -16px rgba(17,19,24,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang HK","PingFang SC","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:470px;display:flex;flex-direction:column;gap:18px}

  /* ---------------- header ---------------- */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .route{
    flex:0 0 auto;
    background:var(--yellow);
    color:#1a1a1a;
    font-weight:800;
    font-size:21px;
    letter-spacing:-.02em;
    line-height:1;
    padding:9px 13px;
    border-radius:13px;
    box-shadow:0 2px 0 rgba(0,0,0,.07), inset 0 -1px 0 rgba(0,0,0,.06);
  }
  .brand-txt{min-width:0}
  .brand-name{font-size:15.5px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
  .brand-sub{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.01em;white-space:nowrap}
  .live{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    font-size:10px;font-weight:800;letter-spacing:.1em;
    color:var(--green);
    background:var(--green-soft);
    border:1px solid #cfe9da;
    padding:5px 9px 5px 8px;border-radius:999px;
    transition:color .2s,background .2s,border-color .2s;
  }
  .live i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:live 2s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .live.wait{color:#8a6d00;background:var(--yellow-soft);border-color:var(--yellow-line)}
  .live.err{color:var(--red);background:var(--red-soft);border-color:#f3d5cf}

  /* ---------------- direction block ---------------- */
  .board{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:opacity .3s ease;
  }
  .board.stale{opacity:.55}
  .bhead{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;
    background:linear-gradient(#fcfbf7,#f8f7f2);
    border-bottom:1px solid var(--line);
  }
  .bl{display:flex;align-items:center;gap:10px;min-width:0}
  .bt{min-width:0}
  .bt-zh{font-size:15px;font-weight:750;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
  .bt-en{font-size:10px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bstop{
    flex:0 0 auto;
    font-size:10.5px;font-weight:650;color:var(--ink-2);
    background:#fff;border:1px solid var(--line);
    padding:4px 9px;border-radius:999px;
    white-space:nowrap;
  }

  /* ---------------- rows ---------------- */
  .rows{display:flex;flex-direction:column}
  .r{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:13px 16px;
    border-top:1px solid var(--line-soft);
  }
  .r:first-child{border-top:0;padding-top:15px;padding-bottom:15px;background:linear-gradient(100deg,#fffdf4,#fffefb 55%,#ffffff)}
  .r-l{display:flex;align-items:baseline;gap:5px;min-width:0}
  .n{
    font-size:41px;font-weight:750;line-height:1;letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    color:var(--ink);
    min-width:1.45em;
  }
  .r:first-child .n{font-size:44px}
  .u{font-size:12.5px;font-weight:650;color:var(--ink-3)}
  .r.soon .n{color:var(--green)}
  .r.due .n{color:var(--red)}
  .n.word{font-size:25px;letter-spacing:-.02em;font-weight:750}
  .r-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
  .t{
    font-size:14.5px;font-weight:650;color:var(--ink-2);
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  }
  .r.soon .t{color:var(--green)}
  .tag{
    font-size:9px;font-weight:800;letter-spacing:.1em;
    color:var(--yellow-deep);background:var(--yellow-soft);
    border:1px solid var(--yellow-line);
    padding:2px 6px;border-radius:5px;line-height:1.3;
  }
  .tag.sched{
    color:var(--ink-3);background:#f4f4ef;border-color:var(--line);
  }

  /* ---------------- states ---------------- */
  .state{padding:28px 20px;text-align:center}
  .state svg{opacity:.35;margin-bottom:9px}
  .state .big{font-size:14px;font-weight:700}
  .state .small{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.55}
  .state.bad .big{color:var(--red)}
  .skel{padding:16px;display:flex;flex-direction:column;gap:9px}
  .skel i{display:block;height:30px;border-radius:8px;background:linear-gradient(90deg,#f2f2ec 25%,#f8f8f4 50%,#f2f2ec 75%);background-size:200% 100%;animation:sh 1.4s infinite}
  .skel i:nth-child(2){width:74%}
  .skel i:nth-child(3){width:48%}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .note{
    padding:9px 16px 11px;
    font-size:10.5px;color:var(--ink-3);
    background:#fcfcfa;border-top:1px solid var(--line-soft);
    line-height:1.5;
  }

  /* ---------------- footer ---------------- */
  .ftr{display:flex;flex-direction:column;gap:10px;padding:0 2px}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .meta{
    font-size:11px;color:var(--ink-3);line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  .meta b{font-weight:700;color:var(--ink-2)}
  button{
    font:inherit;font-size:11.5px;font-weight:700;color:var(--ink-2);
    display:inline-flex;align-items:center;gap:5px;
    background:var(--card);border:1px solid var(--line);
    padding:7px 11px;border-radius:9px;cursor:pointer;
    transition:background .15s,transform .08s,opacity .15s;
  }
  button:hover{background:#fbfbf8}
  button:active{transform:scale(.97)}
  button[disabled]{opacity:.45;cursor:default}
  button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  button.spin svg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .track{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
  .track i{display:block;height:100%;width:100%;background:var(--ink-3);transform-origin:left center;transform:scaleX(0);opacity:.8;transition:transform .9s linear}
  .credit{font-size:9.5px;color:#b0b5bb;text-align:center;letter-spacing:.02em}
  .credit a{color:#b0b5bb;text-decoration:none}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hdr">
    <div class="brand">
      <span class="route">B3A</span>
      <div class="brand-txt">
        <div class="brand-name">深圳灣口岸 ⇄ 富泰</div>
        <div class="brand-sub">城巴 Citybus · 實時到站</div>
      </div>
    </div>
    <div class="live wait" id="live"><i></i><span id="liveTxt">連接中</span></div>
  </header>

  <div id="boards" style="display:flex;flex-direction:column;gap:14px"></div>

  <footer class="ftr">
    <div class="frow">
      <div class="meta" id="meta" aria-live="polite">連接中…</div>
      <button id="refresh" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/></svg>
        <span>刷新</span>
      </button>
    </div>
    <div class="track"><i id="prog"></i></div>
    <div class="credit">資料來源：DATA.GOV.HK 城巴開放數據 · 每 30 秒更新</div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* B3A: Shan King Estate ⇄ Shenzhen Bay Port.
     Outbound "O": board Fu Tai Estate (003261) → alight Shenzhen Bay Port.
     Inbound  "I": board Shenzhen Bay Port (003208) → alight Fu Tai Shopping Centre (003262). */
  var BOARDS = [
    {
      key: "toPort",
      stop: "003261",
      dir: "O",
      zh: "往深圳灣口岸",
      en: "To Shenzhen Bay Port",
      board: "上車 富泰邨",
      note: ""
    },
    {
      key: "toFuTai",
      stop: "003208",
      dir: "I",
      zh: "往富泰",
      en: "To Fu Tai Estate",
      board: "上車 深圳灣口岸",
      note: "落車：富泰商場（003262）· 對面即富泰邨"
    }
  ];

  var REFRESH_MS = 30000;
  var STALE_MS = 90000;

  var boardsEl = document.getElementById("boards");
  var metaEl = document.getElementById("meta");
  var progEl = document.getElementById("prog");
  var liveEl = document.getElementById("live");
  var liveTxt = document.getElementById("liveTxt");
  var btn = document.getElementById("refresh");
  var nextRefreshAt = 0;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function hhmmss(d) { return hhmm(d) + ":" + pad(d.getSeconds()); }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* keep browser-internal wording out of the Chinese UI */
  function errText(err) {
    if (!err) return "網絡連線失敗";
    if (err.name === "AbortError") return "請求逾時";
    var m = err.message || "";
    if (/^HTTP \d+/.test(m)) return "伺服器回應 " + m.replace("HTTP ", "");
    return "網絡連線失敗";
  }

  /* ---------------- shells ---------------- */

  BOARDS.forEach(function (b) {
    var sec = el("section", "board",
      '<div class="bhead">' +
        '<div class="bl">' +
          '<div class="bt">' +
            '<div class="bt-zh">' + b.zh + "</div>" +
            '<div class="bt-en">' + b.en + "</div>" +
          "</div>" +
        "</div>" +
        '<div class="bstop">' + b.board + "</div>" +
      "</div>" +
      '<div class="rows"><div class="skel"><i></i><i></i><i></i></div></div>' +
      (b.note ? '<div class="note">' + b.note + "</div>" : ""));

    b.secEl = sec;
    b.rowsEl = sec.querySelector(".rows");
    b.etas = [];
    b.rows = [];
    b.fetchedAt = 0;
    b.error = null;
    b.loading = false;

    boardsEl.appendChild(sec);
  });

  /* ---------------- fetch ---------------- */

  function loadAll() {
    BOARDS.forEach(function (b, i) {
      setTimeout(function () { load(b); }, i * 120);
    });
  }

  function load(b) {
    if (b.loading) return;
    b.loading = true;
    btn.disabled = true;
    btn.classList.add("spin");

    var url = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/" + b.stop + "/B3A?t=" + Date.now();
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 9000);

    fetch(url, ctrl ? { signal: ctrl.signal, cache: "no-store" } : { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (json) {
        clearTimeout(timer);
        var now = Date.now();
        var raw = (json && json.data) || [];

        b.etas = raw
          .filter(function (e) { return e && e.eta && e.dir === b.dir; })
          .map(function (e) {
            var rmk = ((e.rmk_en || "") + " " + (e.rmk_tc || "")).toLowerCase();
            return {
              t: new Date(e.eta).getTime(),
              sched: rmk.indexOf("sched") > -1 || rmk.indexOf("預") > -1 || rmk.indexOf("预") > -1
            };
          })
          .filter(function (e) { return e.t > now - 60000; })
          .sort(function (x, y) { return x.t - y.t; })
          .slice(0, 3);

        b.fetchedAt = now;
        b.error = null;
        b.loading = false;
        btn.disabled = false;
        btn.classList.remove("spin");
        render(b);
        tick();
      })
      .catch(function (err) {
        clearTimeout(timer);
        b.loading = false;
        btn.disabled = false;
        btn.classList.remove("spin");
        b.error = errText(err);
        if (b.rows.length) b.secEl.classList.add("stale");
        else renderError(b);
        renderMeta();
      });
  }

  /* ---------------- render ---------------- */

  function render(b) {
    b.secEl.classList.remove("stale");
    b.rowsEl.innerHTML = "";
    b.rows = [];

    if (!b.etas.length) {
      b.rowsEl.appendChild(el("div", "state",
        iconClock() +
        '<div class="big">暫無班次</div>' +
        '<div class="small">此站暫時沒有 B3A 到站資料<br>可能已收車或尚未開出</div>'));
      renderMeta();
      return;
    }

    b.etas.forEach(function (e, i) {
      var row = el("div", "r");
      var left = el("div", "r-l");
      var nEl = el("span", "n", "–");
      var uEl = el("span", "u", "分");
      left.appendChild(nEl);
      left.appendChild(uEl);

      var right = el("div", "r-r");
      right.appendChild(el("div", "t", hhmm(new Date(e.t))));

      if (i === 0) right.appendChild(el("div", "tag", "下一班"));
      else if (e.sched) right.appendChild(el("div", "tag sched", "預定"));

      row.appendChild(left);
      row.appendChild(right);
      b.rowsEl.appendChild(row);

      b.rows.push({ row: row, nEl: nEl, uEl: uEl, e: e });
    });

    renderMeta();
  }

  function iconClock() {
    return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';
  }
  function iconAlert() {
    return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/>' +
      '<circle cx="12" cy="12" r="9"/></svg>';
  }

  function renderError(b) {
    b.secEl.classList.remove("stale");
    b.rowsEl.innerHTML = "";
    b.rowsEl.appendChild(el("div", "state bad",
      iconAlert() +
      '<div class="big">暫時取不到資料</div>' +
      '<div class="small">' + esc(b.error || "網絡錯誤") + "<br>每 30 秒自動重試</div>"));
    renderMeta();
  }

  /* ---------------- per-second tick ---------------- */

  function tick() {
    var now = Date.now();

    BOARDS.forEach(function (b) {
      var gone = false;

      b.rows.forEach(function (r) {
        var mins = (r.e.t - now) / 60000;
        r.row.classList.remove("soon", "due");

        if (mins < 1) {
          r.row.classList.add("due");
          r.nEl.textContent = "即將";
          r.nEl.classList.add("word");
          r.uEl.style.display = "none";
        } else {
          if (mins < 6) r.row.classList.add("soon");
          r.nEl.classList.remove("word");
          r.uEl.style.display = "";
          r.nEl.textContent = String(Math.floor(mins));
        }
        if (now - r.e.t > 45000) gone = true;
      });

      if (gone) {
        b.etas = b.etas.filter(function (e) { return Date.now() - e.t <= 45000; });
        render(b);
      }

      if (b.fetchedAt && now - b.fetchedAt > STALE_MS) b.secEl.classList.add("stale");
    });

    renderMeta();
    renderProgress(now);
  }

  function renderProgress(now) {
    var live = BOARDS.filter(function (b) { return b.fetchedAt; });
    if (!live.length) { progEl.style.transform = "scaleX(0)"; return; }
    var oldest = live.reduce(function (m, b) { return Math.min(m, b.fetchedAt); }, Infinity);
    var pct = Math.min(1, (now - oldest) / REFRESH_MS);
    progEl.style.transform = "scaleX(" + pct.toFixed(3) + ")";
  }

  function renderMeta() {
    var now = Date.now();
    var live = BOARDS.filter(function (b) { return b.fetchedAt; });

    if (!live.length) {
      if (BOARDS.some(function (b) { return b.error; })) {
        metaEl.innerHTML = "無法連接 · 每 30 秒自動重試";
        setLive("err", "離線");
      } else {
        metaEl.innerHTML = BOARDS[0].loading ? "正在連接…" : "等待資料…";
        setLive("wait", "連接中");
      }
      return;
    }

    var oldest = live.reduce(function (m, b) { return Math.min(m, b.fetchedAt); }, Infinity);
    var age = now - oldest;
    var failed = BOARDS.some(function (b) { return b.error; });
    var secs = Math.max(0, Math.ceil((nextRefreshAt - now) / 1000));

    metaEl.innerHTML = "更新於 <b>" + hhmmss(new Date(oldest)) + "</b> · " +
      (failed ? "部分資料重試中" : secs + " 秒後更新");

    if (failed && age > REFRESH_MS) setLive("err", "離線");
    else if (age > STALE_MS) setLive("wait", "延遲");
    else setLive("", "LIVE");
  }

  function setLive(kind, text) {
    liveEl.className = "live" + (kind ? " " + kind : "");
    if (liveTxt.textContent !== text) liveTxt.textContent = text;
  }

  /* ---------------- loop ---------------- */

  function schedule() {
    nextRefreshAt = Date.now() + REFRESH_MS;
    setTimeout(function loop() {
      loadAll();
      nextRefreshAt = Date.now() + REFRESH_MS;
      setTimeout(loop, REFRESH_MS);
    }, REFRESH_MS);
  }

  setInterval(tick, 1000);
  btn.addEventListener("click", function () { loadAll(); });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      var now = Date.now();
      if (BOARDS.some(function (b) { return now - b.fetchedAt > REFRESH_MS; })) loadAll();
    }
  });

  loadAll();
  schedule();
})();
</script>
</body>
</html>
